name: Azure deploy

# Builds the container image in ACR and rolls out the Container App
# revision. Auth via OIDC (workload identity federation) — no long-lived
# secrets in the repo.
#
# One-time setup (after the initial deploy.sh bootstrap):
#
#   az ad app create --display-name tokenshelf-github-oidc
#   APP_ID=$(az ad app list --display-name tokenshelf-github-oidc --query "[0].appId" -o tsv)
#   az ad sp create --id $APP_ID
#   SP_OBJ=$(az ad sp show --id $APP_ID --query id -o tsv)
#
#   # Allow GitHub OIDC for main + tags
#   az ad app federated-credential create --id $APP_ID --parameters '{
#     "name":"github-main","issuer":"https://token.actions.githubusercontent.com",
#     "subject":"repo:<OWNER>/<REPO>:ref:refs/heads/main",
#     "audiences":["api://AzureADTokenExchange"]
#   }'
#
#   # Grant Contributor on the deploy RGs + AcrPush on the registry
#   az role assignment create --assignee-object-id $SP_OBJ --assignee-principal-type ServicePrincipal \
#     --role Contributor --scope /subscriptions/<SUB>/resourceGroups/tks-prod-rg
#   az role assignment create --assignee-object-id $SP_OBJ --assignee-principal-type ServicePrincipal \
#     --role AcrPush --scope $(az acr show -n <ACR_NAME> --query id -o tsv)
#
#   # In GitHub Settings → Secrets and variables → Actions, set:
#   #   AZURE_CLIENT_ID         = $APP_ID
#   #   AZURE_TENANT_ID         = 12cf2055-17fd-48fc-bff0-a591d4b061fa
#   #   AZURE_SUBSCRIPTION_ID   = <subscription guid>
#   #   AZURE_RESOURCE_GROUP    = tks-prod-rg
#   #   AZURE_CONTAINER_APP     = tks-app-prod
#   #   AZURE_ACR_NAME          = <registry name without .azurecr.io>

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pitch/**'
      - 'plan/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: [dev, stg, prod]

concurrency:
  group: azure-deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for Azure auth
  contents: read    # checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}
    env:
      ENV: ${{ github.event.inputs.environment || 'prod' }}
      AZURE_REGION: canadacentral
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ secrets.AZURE_ACR_NAME }}" \
            --image "tokenshelf-app:${{ steps.sha.outputs.short }}" \
            --image "tokenshelf-app:latest" \
            --image "tokenshelf-app:${{ env.IMAGE_TAG }}" \
            .

      - name: Roll out new revision
        run: |
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_APP }}" \
            --image "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/tokenshelf-app:${{ steps.sha.outputs.short }}" \
            --revision-suffix "rev-${{ steps.sha.outputs.short }}"

      - name: Wait for revision to be healthy
        run: |
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision list \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_CONTAINER_APP }}" \
              --query "[?contains(name, 'rev-${{ steps.sha.outputs.short }}')].properties.runningState" -o tsv)
            if [[ "$STATE" == "Running" ]]; then
              echo "::notice::Revision rev-${{ steps.sha.outputs.short }} is Running"
              exit 0
            fi
            echo "Waiting for revision (state=$STATE)..."
            sleep 10
          done
          echo "::error::Revision did not reach Running within 5 minutes"
          exit 1

      - name: Smoke-test /api/health
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_APP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in $(seq 1 15); do
            if curl -fsSL "https://${FQDN}/api/health" >/dev/null 2>&1; then
              echo "::notice::https://${FQDN}/api/health → 200"
              curl -fsSL "https://${FQDN}/api/health"
              exit 0
            fi
            sleep 4
          done
          echo "::error::health check did not return 200"
          exit 1

      - name: Job summary
        if: always()
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_APP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "unknown")
          {
            echo "## Deploy summary"
            echo ""
            echo "- **Env:** \`${ENV}\`"
            echo "- **Image:** \`tokenshelf-app:${{ steps.sha.outputs.short }}\`"
            echo "- **App:** https://${FQDN}"
            echo "- **Health:** https://${FQDN}/api/health"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional companion: validate Bicep on every PR so infra drift is caught
  # before merge.
  validate-infra:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Azure CLI + Bicep
        run: |
          az bicep install
          az bicep version
      - name: Build Bicep
        run: az bicep build --file infra/azure/main.bicep --outdir /tmp/arm/
      - name: Lint Bicep
        run: |
          set +e
          OUT=$(az bicep lint --file infra/azure/main.bicep 2>&1)
          echo "$OUT"
          # Treat ERRORs as fatal; warnings are advisory
          echo "$OUT" | grep -q "^ERROR" && exit 1 || exit 0
